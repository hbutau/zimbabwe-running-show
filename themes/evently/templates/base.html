<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <meta name="keywords" content="{% block keywords %}{% endblock %}">

  <!-- Favicons -->
  <link href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/img/favicon.png" rel="icon">
  <link href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">
  <link href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/css/main.css" rel="stylesheet">
</head>

<body class="{% block body_class %}{% endblock %}">

  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center justify-content-between">

      <a href="{{ SITEURL }}/" class="logo d-flex align-items-center">
        <h1 class="sitename">{{ SITENAME }}</h1>
      </a>

      <nav id="navmenu" class="navmenu">
        <ul>
          <li><a href="{{ SITEURL }}/" class="{% if output_file == 'index.html' %}active{% endif %}">Home</a></li>
          <li><a href="{{ SITEURL }}/pages/about.html">About</a></li>
          <li><a href="{{ SITEURL }}/index.html">News</a></li>
          <li><a href="{{ SITEURL }}/pages/contact.html">Contact</a></li>
        </ul>
        <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
      </nav>

    </div>
  </header>

  <main class="main">
    {% block content %}
    {% endblock %}
  </main>

  <footer id="footer" class="footer dark-background">

    <div class="footer-top">
      <div class="container">
        <div class="row gy-4">
          <div class="col-lg-4 col-md-6 footer-about">
            <a href="{{ SITEURL }}/" class="logo d-flex align-items-center">
              <span class="sitename">{{ SITENAME }}</span>
            </a>
            <div class="footer-contact pt-3">
              <p>Zimbabwe</p>
              <p class="mt-3"><strong>Email:</strong> <span>info@zimbabwerunningshow.com</span></p>
            </div>
            <div class="social-links d-flex mt-4">
              <a href=""><i class="bi bi-twitter-x"></i></a>
              <a href=""><i class="bi bi-facebook"></i></a>
              <a href=""><i class="bi bi-instagram"></i></a>
            </div>
          </div>

          <div class="col-lg-2 col-md-3 footer-links">
            <h4>Useful Links</h4>
            <ul>
              <li><a href="{{ SITEURL }}/">Home</a></li>
              <li><a href="{{ SITEURL }}/pages/about.html">About</a></li>
              <li><a href="{{ SITEURL }}/index.html">News</a></li>
              <li><a href="{{ SITEURL }}/pages/contact.html">Contact</a></li>
            </ul>
          </div>

        </div>
      </div>
    </div>

    <div class="container copyright text-center mt-4">
      <p>© <span>Copyright</span> <strong class="px-1 sitename">{{ SITENAME }}</strong> <span>All Rights Reserved</span></p>
      <div class="credits">
        Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a>
      </div>
    </div>

  </footer>

  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Vendor JS Files -->
  <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/php-email-form/validate.js"></script>
  <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/vendor/glightbox/js/glightbox.min.js"></script>

  <!-- Main JS File -->
  <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/assets/js/main.js"></script>

</body>
</html>
