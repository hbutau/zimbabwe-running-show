{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ SITENAME }}{% endblock %}

{% block body_class %}{{ page.slug }}-page{% endblock %}

{% block content %}
<!-- Page Banner -->
<section class="page-banner dark-background">
  <div class="background-overlay"></div>
  <div class="container">
    <div class="banner-content text-center">
      <h1>{{ page.title }}</h1>
      <nav class="breadcrumbs">
        <ol>
          <li><a href="{{ SITEURL }}/">Home</a></li>
          <li class="current">{{ page.title }}</li>
        </ol>
      </nav>
    </div>
  </div>
</section><!-- End Page Banner -->

<!-- Page Content Section -->
<section id="page-content" class="section">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        {{ page.content }}
      </div>
    </div>
  </div>
</section><!-- End Page Content Section -->

{% endblock %}
